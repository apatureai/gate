# Apature Gate — GitHub Action entrypoint (Action path, TRD §2).
# Judgment-only: this action needs `checks: write` and `pull-requests: write`
# only. It MUST NOT be granted `contents: write` (see packages/action
# GATE_GITHUB_PERMISSIONS). Set permissions in the calling workflow:
#   permissions:
#     contents: read
#     pull-requests: write
#     checks: write
name: "Apature Gate"
description: "Judgment-only design review for your PR preview deployments. Requires a critique service you host; none ships here, and without one this action reviews nothing and says so."
author: "Apature"
branding:
  icon: "eye"
  color: "purple"
inputs:
  preview-url:
    description: "Explicit preview URL to review. Overrides discovery."
    required: false
  preview-command:
    description: "Command to build and serve the app locally as a fallback."
    required: false
  config-path:
    description: "Path to .gate.yml."
    required: false
    default: ".gate.yml"
  # No default, on purpose. An input's default is delivered to the container
  # exactly like a value the caller typed, so `default: "none"` made this input
  # always set, and it overrode `rules.gate` from .gate.yml on every run: a
  # repository that had opted into `rules.gate: blockers` in the file got an
  # advisory check that could never fail and never said it had been overridden.
  # Unset means "use the file"; see packages/action/src/action-config.ts.
  gate-mode:
    description: "Override rules.gate from .gate.yml: none | nits | blockers. Leave unset to use the file's value."
    required: false
  github-token:
    description: "Token used to post the sticky comment and Check Run."
    required: false
    default: "${{ github.token }}"
runs:
  using: "docker"
  image: "Dockerfile.action"
  env:
    INPUT_PREVIEW_URL: "${{ inputs.preview-url }}"
    INPUT_PREVIEW_COMMAND: "${{ inputs.preview-command }}"
    INPUT_CONFIG_PATH: "${{ inputs.config-path }}"
    INPUT_GATE_MODE: "${{ inputs.gate-mode }}"
    INPUT_GITHUB_TOKEN: "${{ inputs.github-token }}"
