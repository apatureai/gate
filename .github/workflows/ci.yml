name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/build

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (warnings fail the build)
        run: pnpm lint

      - name: Typecheck (all packages via project references)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  dashboard:
    name: dashboard next build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Gate packages
        run: pnpm build

      - name: Setup dashboard npm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

  images:
    name: images · boot · shutdown · SBOM · scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_DB: gate
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:cd5f3ac681c77791c6a8eaa62de876ad2be043ee5a428afb7c0095aa08246277
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_IMAGE: apature-gate-app:ci
      ACTION_IMAGE: apature-gate-action:ci
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build shipped images from the frozen lockfile
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker build --pull --file Dockerfile --tag "$APP_IMAGE" .
          docker build --pull --file Dockerfile.action --tag "$ACTION_IMAGE" .

      - name: Assert Node 24 and the Action PID-1 contract
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node "$APP_IMAGE" --version | grep -E '^v24\.'
          docker run --rm --entrypoint node "$ACTION_IMAGE" --version | grep -E '^v24\.'
          for image in "$APP_IMAGE" "$ACTION_IMAGE"; do
            docker run --rm --entrypoint /bin/sh "$image" -c \
              '. /etc/os-release; test "$ID $VERSION_ID" = "debian 13"'
            docker run --rm --entrypoint /bin/sh "$image" -c \
              'dpkg --compare-versions "$(dpkg-query -W liblzma5 | cut -f2)" ge "5.8.1-1+deb13u1"'
          done
          docker run --rm --entrypoint /bin/sh "$APP_IMAGE" -c '! command -v npm && ! command -v corepack'
          docker run --rm --entrypoint /bin/sh "$ACTION_IMAGE" -c \
            'test "$(npm --version)" = "11.18.0" && command -v corepack && command -v pnpm && command -v yarn'
          docker run --rm --entrypoint /bin/sh "$ACTION_IMAGE" -c 'test -x /usr/bin/tini'
          docker image inspect "$ACTION_IMAGE" \
            --format '{{json .Config.Entrypoint}}' \
            | jq -e '. == ["/usr/bin/tini","--","node","packages/action/dist/main.js"]'

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Generate SPDX JSON SBOMs
        run: |
          set -euo pipefail
          trivy image --format spdx-json --output artifacts/gate-app.spdx.json "$APP_IMAGE"
          trivy image --format spdx-json --output artifacts/gate-action.spdx.json "$ACTION_IMAGE"

      - name: Record fixable medium, high, and critical vulnerabilities
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output artifacts/gate-app.vulnerabilities.json \
            "$APP_IMAGE"
          trivy image \
            --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output artifacts/gate-action.vulnerabilities.json \
            "$ACTION_IMAGE"

      - name: Run migrations and smoke the real App entrypoint
        run: |
          set -euo pipefail
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/github-app-private-key.pem" \
            2>/dev/null

          docker run --rm --network host \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gate \
            --entrypoint node \
            "$APP_IMAGE" \
            packages/db/dist/cli/migrate.js

          docker run --detach --name gate-app-smoke --network host \
            --env PORT=8080 \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gate \
            --env REDIS_URL=redis://127.0.0.1:6379 \
            --env GITHUB_APP_ID=1 \
            --env "GITHUB_APP_PRIVATE_KEY=$(cat "$RUNNER_TEMP/github-app-private-key.pem")" \
            --env GITHUB_WEBHOOK_SECRET=fixture-webhook-secret \
            --env JUDGMENT_ENGINE_ENDPOINT=http://127.0.0.1:65535 \
            --env JUDGMENT_ENGINE_API_KEY=fixture-engine-key \
            --env JUDGMENT_ENGINE_HMAC_SECRET=fixture-engine-hmac \
            --env STRIPE_SECRET_KEY=fixture-stripe-key \
            --env STRIPE_WEBHOOK_SECRET=fixture-stripe-webhook \
            --env 'GATE_SCREENSHOT_OBJECT_URL_TEMPLATE=https://objects.invalid/{objectKey}' \
            --env SCREENSHOT_CAPABILITY_SECRET=fixture-screenshot-capability \
            --env FEEDBACK_TOKEN_SECRET=fixture-feedback-token \
            "$APP_IMAGE"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' gate-app-smoke)" != "true" ]; then
              docker logs gate-app-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz \
            | jq -e '.status == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz \
            | jq -e '.ready == true'

          docker stop --time 15 gate-app-smoke >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' gate-app-smoke)" = "0"

      - name: Preserve App logs and remove smoke container
        if: always()
        run: |
          mkdir -p artifacts
          docker logs gate-app-smoke >artifacts/gate-app-smoke.log 2>&1 || true
          docker rm --force gate-app-smoke >/dev/null 2>&1 || true

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-image-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the fixable medium-or-higher vulnerability gate
        run: |
          set -euo pipefail
          jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' \
            artifacts/gate-app.vulnerabilities.json
          jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' \
            artifacts/gate-action.vulnerabilities.json
