name: Deploy

# Deploys the Gate service to Fly on merge to main. The release command runs
# migrations; secrets come from the Fly secret store, not from CI.
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when Fly is not configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: |
          echo "FLY_API_TOKEN is not configured yet; skipping production deploy."
          echo "Set FLY_API_TOKEN and Fly runtime secrets to enable this workflow."

      - name: Checkout
        if: ${{ env.FLY_API_TOKEN != '' }}
        uses: actions/checkout@v6

      - name: Setup flyctl
        if: ${{ env.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only
